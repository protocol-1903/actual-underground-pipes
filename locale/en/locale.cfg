[entity-name]
tomwub-underground=Underground __1__

[controls]
tomwub-alt-mode=Toggle Underground Pipe Visualization

local ticks_per_scan = 181 -- ticks between full scans for new entities
local ticks_per_update = 251 -- ticks between tracker checks
local min_registrations_per_tick = 12 -- minumum number of tracker registrations per tick
local checks_per_update = 4 -- checks before a tracker's tint and mask are updated

[mod-setting-name]
pipe-opacity=Underground pipe opacity
npt-tomwub-weaving=Enable underground pipe weaving
tomwub-underground-indicators-range=Underground pipe rendering range
tomwub-ticks-per-scan=Ticks between full scans for new entities
tomwub-ticks-per-update=Ticks between tracker checks
tomwub-min-registrations-per-tick=Minimum number of tracker registrations per tick
tomwub-checks-per-update=Tracker updates before the tint and mask are updated

[mod-setting-description]
npt-tomwub-weaving=Different types of underground pipes do not collide with each other, such as iron and copper pipes. Allows weaving of underground pipe networks.
tomwub-ticks-per-scan=Entities will be scanned for around the player every n ticks. They will be added to a queue which will be polled according to the other settings. Ppolled entities will have renders attached and be removed from the queue. Decrease this setting to increase the scan frequency.
tomwub-ticks-per-update=Ticks between checking if a render should be visible and ensuring they stay rendered
tomwub-min-registrations-per-tick=The lowest number of tracker registrations per tick. This number will temporarily increase if too many entities are in the queue. Increase this number to have more trackers rendered faster.
tomwub-checks-per-update=Not all checks are done on every update, this number determines how many updates are performed before updating the tint and connection mask of the render. These updates are more costly, so it's not recommended to be every update. Set to 1 to perform checks every update.