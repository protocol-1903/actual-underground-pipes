[string-mod-setting]
tomwub-migration-mode-off=Выкл
tomwub-migration-mode-safe=Безопасный
tomwub-migration-mode-unsafe=Небезопасный

[mod-setting-description]
npt-tomwub-weaving=Разные типы подземных труб не будут пересекатся друг с другом, например железные и медные трубы. Позволяет переплетать подземные трубопроводы.
tomwub-migration-mode=Метод, с помощью которого этот мод попытается изменить файл сохранения для использования настоящих подемных труб вместо ванильной системы подземных труб. ЭТО ДОЛЖНО БЫТЬ ВЫБРАНО ПРИ ДОБАВЛЕНИИ МОДА; ПОСЛЕ, ЭТА ОПЦИЯ РАБОТАТЬ НЕ БУДЕТ.

[string-mod-setting-description]
tomwub-migration-mode-off=Перенесения не будет.
tomwub-migration-mode-safe=Подземные трубы будут размещены только там, где они гарантированно не присоеденятся к сторонним трубам. На те места, где трубы могли пересекатся, будут добавлены отметки.
tomwub-migration-mode-unsafe=Подземные трубы будут размещены везде, даже если они пересекаются с другими подземными трубами. На те места, где трубы пересекаются, будут добавлены отметки.